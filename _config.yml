# =========================================================
#  CONFIGURAÇÃO DO BLOG — edite só esta parte de cima
# =========================================================

title: "Jefferson"                     # nome que aparece no topo do site
tagline: "QA & Automação de Testes SAP" # frase curta embaixo do nome
description: "Blog pessoal do Jefferson: carreira, qualidade de software, automação de testes e um pouco da vida."

author:
  name: "Jefferson"
  avatar: "https://github.com/jeffersondk3.png"   # usa a foto do GitHub; troque por /assets/img/foto.jpg se quiser
  bio: "Trabalho com qualidade de software e automação de testes em ambientes SAP. Aqui escrevo sobre o que aprendo no caminho."

# Links das redes — deixe "" (vazio) para esconder
social:
  github: "jeffersondk3"
  linkedin: ""        # ex.: "jefferson-silva"  (só o final do link)
  instagram: ""       # ex.: "jefferson"
  email: ""           # ex.: "jefferson@email.com"

# =========================================================
#  Daqui pra baixo não precisa mexer
# =========================================================

url: "https://jeffersondk3.github.io"
baseurl: ""
lang: pt-BR
timezone: America/Sao_Paulo

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /:year/:month/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - COMO-POSTAR.md
  - Gemfile
  - Gemfile.lock
